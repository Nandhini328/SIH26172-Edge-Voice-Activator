<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#ffffff"/>
<style>
.title{font:700 40px Arial;fill:#0b234a}.sub{font:400 22px Arial;fill:#17234d}.head{font:700 23px Arial;fill:#fff}.boxh{font:700 22px Arial;fill:#10213f}.txt{font:400 17px Arial;fill:#14213d}.small{font:400 15px Arial;fill:#14213d}.bold{font:700 16px Arial;fill:#14213d}.foot{font:700 24px Arial;fill:#0b234a}
</style>
<text x="800" y="55" text-anchor="middle" class="title">Proposed System Architecture</text>
<text x="800" y="90" text-anchor="middle" class="sub">Low Latency and Efficient Voice Activator for Edge Devices (PS26172)</text>

<!-- regions -->
<rect x="120" y="125" width="1010" height="535" rx="22" fill="#eef7ff" stroke="#5da9e9" stroke-width="2" stroke-dasharray="10 8"/>
<rect x="1165" y="125" width="355" height="535" rx="22" fill="#f2fff7" stroke="#6bc495" stroke-width="2" stroke-dasharray="10 8"/>
<rect x="320" y="138" width="615" height="55" rx="14" fill="#15498d"/>
<text x="627" y="173" text-anchor="middle" class="head">Edge Device (ESP32-S3) - Always Listening</text>
<rect x="1185" y="138" width="315" height="55" rx="14" fill="#2e8157"/>
<text x="1342" y="173" text-anchor="middle" class="head">Cloud / Server (Triggered Only)</text>

<!-- input -->
<circle cx="43" cy="320" r="28" fill="#092b63"/>
<path d="M68 305 q35 15 0 30" fill="none" stroke="#092b63" stroke-width="7"/>
<text x="43" y="377" text-anchor="middle" class="bold">Voice Input</text><text x="43" y="399" text-anchor="middle" class="small">“Hey Kira”</text>
<path d="M78 320 H125" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>

<!-- boxes -->
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker></defs>
<rect x="140" y="230" width="170" height="205" rx="14" fill="#fff0f5" stroke="#f0b4c9"/>
<text x="225" y="270" text-anchor="middle" class="boxh">INMP441</text><text x="225" y="299" text-anchor="middle" class="boxh">I2S Microphone</text><text x="225" y="342" text-anchor="middle" class="txt">16 kHz / 16-bit</text><text x="225" y="367" text-anchor="middle" class="txt">Mono PCM</text><text x="225" y="395" text-anchor="middle" class="small">Audio acquisition</text>

<rect x="345" y="230" width="205" height="205" rx="14" fill="#fff7dc" stroke="#e8cf79"/>
<text x="447" y="268" text-anchor="middle" class="boxh">Audio</text><text x="447" y="295" text-anchor="middle" class="boxh">Pre-processing</text><text x="363" y="332" class="txt">• Ring buffer / framing</text><text x="363" y="359" class="txt">• Noise filtering</text><text x="363" y="386" class="txt">• Energy + ZCR</text><text x="363" y="413" class="small">Fast rejection</text>

<rect x="585" y="230" width="205" height="205" rx="14" fill="#e9fff1" stroke="#a6d8b7"/>
<text x="687" y="268" text-anchor="middle" class="boxh">Feature</text><text x="687" y="295" text-anchor="middle" class="boxh">Extraction</text><text x="603" y="332" class="txt">• Mel filter bank</text><text x="603" y="359" class="txt">• MFE / MFCC</text><text x="603" y="386" class="txt">• Normalization</text>

<rect x="825" y="230" width="205" height="205" rx="14" fill="#f0edff" stroke="#b5a9eb"/>
<text x="927" y="268" text-anchor="middle" class="boxh">Lightweight CNN</text><text x="927" y="295" text-anchor="middle" class="boxh">/ DS-CNN</text><text x="843" y="332" class="txt">• INT8 quantized</text><text x="843" y="359" class="txt">• TFLite Micro</text><text x="843" y="386" class="txt">• On-device inference</text>

<rect x="1065" y="230" width="230" height="205" rx="14" fill="#fff0f4" stroke="#f0b2c4"/>
<text x="1180" y="268" text-anchor="middle" class="boxh">Wake-word Decision</text><text x="1083" y="314" class="txt">• Confidence score</text><text x="1083" y="342" class="txt">• Temporal debounce</text><text x="1083" y="370" class="txt">• Thresholding</text>

<!-- arrows -->
<path d="M310 332 H345" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M550 332 H585" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M790 332 H825" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1030 332 H1065" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>

<!-- decision -->
<rect x="865" y="470" width="190" height="70" rx="18" fill="#30cc8a" stroke="#149860"/>
<text x="960" y="500" text-anchor="middle" class="bold">Wake Word</text><text x="960" y="523" text-anchor="middle" class="bold">Detected?</text>
<path d="M1180 435 V470" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1080" y="493" class="bold">Yes →</text>
<text x="840" y="493" class="bold">No</text>
<path d="M865 505 H770 V590 H225 V435" fill="none" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
<text x="535" y="617" text-anchor="middle" class="sub">Keep listening…</text>

<!-- server -->
<rect x="1190" y="230" width="305" height="125" rx="14" fill="#eaf4ff" stroke="#a0c9ed"/>
<text x="1342" y="268" text-anchor="middle" class="boxh">Audio Streaming</text><text x="1342" y="300" text-anchor="middle" class="txt">Stream audio after wake word</text><text x="1342" y="326" text-anchor="middle" class="small">WebSocket / network</text>
<rect x="1190" y="380" width="305" height="125" rx="14" fill="#fff2df" stroke="#efc98f"/>
<text x="1342" y="418" text-anchor="middle" class="boxh">Remote ASR</text><text x="1342" y="450" text-anchor="middle" class="txt">Speech-to-text (Whisper / OSS)</text>
<rect x="1190" y="530" width="305" height="100" rx="14" fill="#eeeaff" stroke="#c0b3eb"/>
<text x="1342" y="568" text-anchor="middle" class="boxh">Text / Command</text><text x="1342" y="596" text-anchor="middle" class="small">For application processing</text>
<path d="M1295 505 H1295"/>
<path d="M1295 355 V380" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1342 505 V530" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1055 505 H1189" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>

<!-- highlights -->
<rect x="20" y="690" width="1500" height="120" rx="18" fill="#eef6ff" stroke="#8fc0ef"/>
<text x="45" y="725" class="boxh">Key Highlights</text>
<text x="70" y="764" class="bold">⚡ Ultra-low latency: &lt;100 ms target</text>
<text x="335" y="764" class="bold">⛨ Local &amp; offline wake detection</text>
<text x="650" y="764" class="bold">◎ Robust accuracy target &gt;90%</text>
<text x="945" y="764" class="bold">▣ TinyML INT8 deployment</text>
<text x="1205" y="764" class="bold">◉ Power target &lt;50 mW</text>
<text x="800" y="795" text-anchor="middle" class="foot">Fast • Private • Efficient • Built for the Edge</text>
</svg>