<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#163a70"/></marker>
  <style>
    .title{font:700 42px Arial,sans-serif;fill:#102c57}
    .subtitle{font:400 22px Arial,sans-serif;fill:#395579}
    .panelTitle{font:700 24px Arial,sans-serif;fill:white}
    .head{font:700 22px Arial,sans-serif;fill:#102c57}
    .body{font:400 17px Arial,sans-serif;fill:#233c5d}
    .small{font:400 15px Arial,sans-serif;fill:#46627f}
    .decision{font:700 18px Arial,sans-serif;fill:#153c68}
    .highlightHead{font:700 20px Arial,sans-serif;fill:#102c57}
    .highlightBody{font:400 16px Arial,sans-serif;fill:#34506f}
    .footer{font:700 24px Arial,sans-serif;fill:#102c57}
  </style>
</defs>

<rect width="1600" height="900" fill="#ffffff"/>
<text x="800" y="55" text-anchor="middle" class="title">Proposed System Architecture</text>
<text x="800" y="90" text-anchor="middle" class="subtitle">Low Latency and Efficient Voice Activator for Edge Devices — PS26172</text>

<!-- Main panels -->
<rect x="25" y="125" width="1110" height="545" rx="26" fill="#f3f9ff" stroke="#85bdea" stroke-width="3"/>
<rect x="1165" y="125" width="410" height="545" rx="26" fill="#f4fbf7" stroke="#7bc59b" stroke-width="3"/>

<rect x="45" y="145" width="1070" height="58" rx="15" fill="#1d5598"/>
<text x="580" y="182" text-anchor="middle" class="panelTitle">EDGE DEVICE (ESP32-S3) — ALWAYS LISTENING</text>

<rect x="1185" y="145" width="370" height="58" rx="15" fill="#23845a"/>
<text x="1370" y="174" text-anchor="middle" class="panelTitle">CLOUD / SERVER</text>
<text x="1370" y="194" text-anchor="middle" class="small" fill="white">Triggered only after wake word</text>

<!-- Voice input -->
<circle cx="57" cy="330" r="34" fill="#173f78"/>
<path d="M82 312 Q115 330 82 348" fill="none" stroke="#173f78" stroke-width="8"/>
<text x="57" y="390" text-anchor="middle" class="head">Voice Input</text>
<text x="57" y="414" text-anchor="middle" class="small">“Hey Kira”</text>
<line x1="93" y1="330" x2="135" y2="330" stroke="#163a70" stroke-width="4" marker-end="url(#arrow)"/>

<!-- Edge boxes -->
<rect x="135" y="245" width="180" height="205" rx="18" fill="#fff0f5" stroke="#edb4c8" stroke-width="2"/>
<text x="225" y="286" text-anchor="middle" class="head">INMP441</text>
<text x="225" y="314" text-anchor="middle" class="head">I2S Microphone</text>
<line x1="160" y1="332" x2="290" y2="332" stroke="#ddb2c0"/>
<text x="225" y="361" text-anchor="middle" class="body">16 kHz / 16-bit</text>
<text x="225" y="388" text-anchor="middle" class="body">Mono PCM</text>
<text x="225" y="420" text-anchor="middle" class="small">Audio acquisition</text>

<rect x="350" y="245" width="200" height="205" rx="18" fill="#fff8df" stroke="#e7cf78" stroke-width="2"/>
<text x="450" y="286" text-anchor="middle" class="head">Audio Pre-processing</text>
<text x="370" y="326" class="body">• Ring buffer + framing</text>
<text x="370" y="355" class="body">• Noise filtering</text>
<text x="370" y="384" class="body">• Energy + ZCR</text>
<text x="370" y="419" class="small">Fast rejection before ML</text>

<rect x="585" y="245" width="200" height="205" rx="18" fill="#eafbf1" stroke="#a3d5b5" stroke-width="2"/>
<text x="685" y="286" text-anchor="middle" class="head">Feature Extraction</text>
<text x="605" y="326" class="body">• Mel filter bank</text>
<text x="605" y="355" class="body">• MFE / MFCC</text>
<text x="605" y="384" class="body">• Normalization</text>
<text x="605" y="419" class="small">Speech representation</text>

<rect x="820" y="245" width="200" height="205" rx="18" fill="#f0edff" stroke="#b9aae8" stroke-width="2"/>
<text x="920" y="282" text-anchor="middle" class="head">Lightweight CNN</text>
<text x="920" y="310" text-anchor="middle" class="head">/ DS-CNN</text>
<text x="840" y="347" class="body">• INT8 quantized</text>
<text x="840" y="376" class="body">• TFLite Micro</text>
<text x="840" y="405" class="body">• On-device inference</text>

<rect x="1055" y="245" width="60" height="205" rx="18" fill="#ffffff" stroke="#e5aec0" stroke-width="2"/>
<rect x="1035" y="245" width="210" height="205" rx="18" fill="#fff0f4" stroke="#edb4c8" stroke-width="2"/>
<text x="1140" y="282" text-anchor="middle" class="head">Wake-word</text>
<text x="1140" y="309" text-anchor="middle" class="head">Decision</text>
<text x="1055" y="348" class="body">• Confidence</text>
<text x="1055" y="377" class="body">• Threshold</text>
<text x="1055" y="406" class="body">• Temporal debounce</text>

<!-- Arrows between edge blocks -->
<line x1="315" y1="348" x2="350" y2="348" stroke="#163a70" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="550" y1="348" x2="585" y2="348" stroke="#163a70" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="785" y1="348" x2="820" y2="348" stroke="#163a70" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1020" y1="348" x2="1035" y2="348" stroke="#163a70" stroke-width="4" marker-end="url(#arrow)"/>

<!-- Decision diamond -->
<polygon points="970,515 1090,470 1210,515 1090,560" fill="#dff7eb" stroke="#219663" stroke-width="3"/>
<text x="1090" y="510" text-anchor="middle" class="decision">Wake word</text>
<text x="1090" y="533" text-anchor="middle" class="decision">detected?</text>
<line x1="1140" y1="450" x2="1098" y2="480" stroke="#163a70" stroke-width="4" marker-end="url(#arrow)"/>

<!-- No loop -->
<text x="1090" y="600" text-anchor="middle" class="small">NO → continue listening</text>
<path d="M970 515 H900 V620 H225 V450" fill="none" stroke="#163a70" stroke-width="4" marker-end="url(#arrow)"/>

<!-- Yes to server -->
<text x="1212" y="510" class="decision">YES</text>
<line x1="1210" y1="515" x2="1240" y2="515" stroke="#163a70" stroke-width="4" marker-end="url(#arrow)"/>

<!-- Server boxes -->
<rect x="1210" y="245" width="335" height="115" rx="18" fill="#eaf5ff" stroke="#9dc8ec" stroke-width="2"/>
<text x="1377" y="286" text-anchor="middle" class="head">Audio Streaming</text>
<text x="1377" y="316" text-anchor="middle" class="body">Stream audio only after wake word</text>
<text x="1377" y="340" text-anchor="middle" class="small">WebSocket / network</text>

<rect x="1210" y="390" width="335" height="115" rx="18" fill="#fff3df" stroke="#edc68a" stroke-width="2"/>
<text x="1377" y="431" text-anchor="middle" class="head">Remote ASR</text>
<text x="1377" y="461" text-anchor="middle" class="body">Speech-to-text</text>
<text x="1377" y="485" text-anchor="middle" class="small">Whisper / open-source ASR</text>

<rect x="1210" y="535" width="335" height="95" rx="18" fill="#efedff" stroke="#c2b5ec" stroke-width="2"/>
<text x="1377" y="572" text-anchor="middle" class="head">Text / Command</text>
<text x="1377" y="602" text-anchor="middle" class="small">Application / IoT processing</text>

<line x1="1377" y1="360" x2="1377" y2="390" stroke="#163a70" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1377" y1="505" x2="1377" y2="535" stroke="#163a70" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="1240" y1="515" x2="1240" y2="302" stroke="#163a70" stroke-width="4" marker-end="url(#arrow)"/>

<!-- Highlights -->
<rect x="25" y="705" width="1550" height="115" rx="22" fill="#f5f9ff" stroke="#a7ccef" stroke-width="2"/>
<text x="50" y="740" class="highlightHead">KEY HIGHLIGHTS</text>
<g>
 <rect x="50" y="755" width="275" height="48" rx="12" fill="#e7f2ff"/>
 <text x="70" y="783" class="highlightHead">&lt;100 ms</text><text x="176" y="783" class="highlightBody">wake detection target</text>
 <rect x="345" y="755" width="275" height="48" rx="12" fill="#e9faf1"/>
 <text x="365" y="783" class="highlightHead">Local &amp; Offline</text><text x="495" y="783" class="highlightBody">wake detection</text>
 <rect x="640" y="755" width="275" height="48" rx="12" fill="#f4edff"/>
 <text x="660" y="783" class="highlightHead">&gt;90% target</text><text x="770" y="783" class="highlightBody">noisy environments</text>
 <rect x="935" y="755" width="275" height="48" rx="12" fill="#eaf4ff"/>
 <text x="955" y="783" class="highlightHead">INT8 TinyML</text><text x="1070" y="783" class="highlightBody">edge inference</text>
 <rect x="1230" y="755" width="315" height="48" rx="12" fill="#eaf9f2"/>
 <text x="1250" y="783" class="highlightHead">&lt;50 mW</text><text x="1337" y="783" class="highlightBody">always-listening target</text>
</g>
<text x="800" y="862" text-anchor="middle" class="footer">Fast • Private • Efficient • Built for the Edge</text>
</svg>